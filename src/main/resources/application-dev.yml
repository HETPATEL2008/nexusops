spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexusops}
    username: ${DB_USERNAME:nexusops}
    password: ${DB_PASSWORD:nexusops}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.hetpatel.nexusops: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG