spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nexusops
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.hetpatel.nexusops: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

debug: false