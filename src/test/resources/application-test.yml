spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nexusops_test
    username: nexusops
    password: nexusops
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.hetpatel.nexusops: INFO